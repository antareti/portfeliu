<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дневник доброго хакера</title>

<link rel="icon" href="o.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
:root{
--bg:#050505;
--text:#e5e5e5;
--accent:#ff8c00;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:var(--bg);
color:var(--text);
font-family:'JetBrains Mono', monospace;
overflow-x:hidden;
}

/* MATRIX */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
background:#111;
display:flex;
justify-content:center;
gap:30px;
padding:15px;
z-index:999;
}

nav a{
color:var(--accent);
cursor:pointer;
text-decoration:none;
}

/* SECTIONS */
.section{
display:none;
padding:100px 20px;
max-width:1000px;
margin:auto;
position:relative;
z-index:2;
}

.active{display:block;}

/* UI */
.card{
background:rgba(255,140,0,0.05);
border:1px solid rgba(255,140,0,0.2);
border-radius:15px;
padding:20px;
margin:20px 0;
}

.btn{
display:inline-block;
padding:12px;
background:linear-gradient(45deg,#ff8c00,#ffa500);
color:#000;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

/* PRICING */
.pricing{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.plan{
background:#111;
padding:20px;
border-radius:12px;
transition:0.3s;
}

.plan:hover{
transform:scale(1.05);
}

/* CHAT */
.chat{
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
background:#111;
padding:10px;
border-radius:10px;
}

/* notify */
#notify{
position:fixed;
top:20px;
right:20px;
z-index:999;
}

.note{
background:#111;
padding:10px;
border-left:3px solid orange;
margin-bottom:10px;
}

/* urgency */
.urgency{
color:red;
text-align:center;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<nav>
<a onclick="show('home')">Главная</a>
<a onclick="show('services')">Услуги</a>
<a onclick="show('reviews')">Отзывы</a>
<a onclick="show('contact')">Контакт</a>
</nav>

<div id="notify"></div>

<!-- HOME -->
<div id="home" class="section active">
<h1>🧠 Дневник хакера</h1>

<div class="card">
<h2>⚡ Решаю задачи быстро</h2>
<p>Скрипты, автоматизация, нестандартные решения</p>
<button class="btn" onclick="show('services')">Смотреть услуги</button>
</div>

<div class="card urgency">
⏳ Осталось <span id="slots">3</span> слота
</div>
</div>

<!-- SERVICES -->
<div id="services" class="section">
<h1>💸 Услуги</h1>

<div class="pricing">

<div class="plan">
<h3>Быстрый фикс</h3>
<div>5$</div>
<a class="btn" href="https://t.me/hackpack1977?text=фикс">Заказать</a>
</div>

<div class="plan">
<h3>Стандарт</h3>
<div>15$</div>
<a class="btn" href="https://t.me/hackpack1977?text=стандарт">Заказать</a>
</div>

<div class="plan">
<h3>PRO</h3>
<div>50$+</div>
<a class="btn" href="https://t.me/hackpack1977?text=PRO">Заказать</a>
</div>

</div>
</div>

<!-- REVIEWS -->
<div id="reviews" class="section">
<h1>💬 Отзывы</h1>
<div class="chat" id="chat"></div>
</div>

<!-- CONTACT -->
<div id="contact" class="section">
<h1>📡 Контакт</h1>

<div class="card">
<a class="btn" href="https://t.me/hackpack1977">
🚀 Написать в Telegram
</a>
</div>

</div>

<script>

/* navigation */
function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* MATRIX */
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
c.height=window.innerHeight;
c.width=window.innerWidth;

const letters="01";
const fontSize=14;
const columns=c.width/fontSize;
const drops=[];

for(let x=0;x<columns;x++)drops[x]=1;

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,c.width,c.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
const text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);
if(drops[i]*fontSize>c.height&&Math.random()>0.975)drops[i]=0;
drops[i]++;
}
}

setInterval(draw,33);

/* urgency */
setInterval(()=>{
let el=document.getElementById("slots");
let n=parseInt(el.innerText);
if(n>1) el.innerText=n-1;
},8000);

/* reviews */
const reviews = [
"Сделал за вечер 🔥",
"Работает идеально",
"Очень быстро",
"Рекомендую 💯"
];

let i=0;

function addMsg(){
if(i>=reviews.length) return;

let d=document.createElement("div");
d.className="msg";
d.innerText=reviews[i];

document.getElementById("chat").appendChild(d);

i++;
setTimeout(addMsg,1000);
}

addMsg();

/* notify */
function showNote(t){
let n=document.createElement("div");
n.className="note";
n.innerText=t;
document.getElementById("notify").appendChild(n);
setTimeout(()=>n.remove(),3000);
}

/* fake sales */
setInterval(()=>{
showNote("💸 Новый заказ");
},5000);

</script>

</body>
</html>
